name: Prepare IOTA validation
description: Pin the source, lockfile, compiler and local sandbox for both cache providers.
runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: 06968cbc306df046ddd0ece11a2a7c048280a8c5
        path: source
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.98.0
    - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6
      with:
        tool: sccache@0.17.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: cargo-lock
        path: source
    - name: Install local sandbox and build prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libclang-dev libssl-dev pkg-config parallel postgresql-client libpq5
        mkdir -p "$RUNNER_TEMP/iota" "$RUNNER_TEMP/toml" "$RUNNER_TEMP/validation"
        curl -fsSL https://github.com/iotaledger/iota/releases/download/v1.31.1-rc/iota-v1.31.1-rc-linux-x86_64.tgz | tar -xz -C "$RUNNER_TEMP/iota"
        curl -fsSL https://github.com/gnprice/toml-cli/releases/download/v0.2.3/toml-0.2.3-x86_64-linux.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/toml"
        echo "$RUNNER_TEMP/iota" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/toml" >> "$GITHUB_PATH"
        cp operator/.boringcache.toml source/.boringcache.toml
        cp operator/.github/boringcache-build.sh source/.github/boringcache-build.sh
        sed -i "s/VALIDATION_SEED/$GITHUB_RUN_ID/g" source/.boringcache.toml
        rustc -Vv > "$RUNNER_TEMP/validation/rustc.txt"
